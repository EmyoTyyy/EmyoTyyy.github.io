<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!-- The source of assets/og.png. Rendered at 1200x630 and screenshotted;
         kept so the card can be made again when the headline changes. -->
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      html, body { margin: 0; padding: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        background:
          radial-gradient(900px 460px at 82% 12%, rgba(var(--accent-bright), 0.20), transparent 62%),
          radial-gradient(700px 420px at 8% 92%, rgba(var(--accent-bright), 0.10), transparent 60%),
          var(--page);
        display: grid; grid-template-columns: 1fr 1fr; align-items: center;
        gap: 40px; padding: 64px 72px; box-sizing: border-box;
      }
      .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 34px; }
      .brand .nav__lambda { height: 72px; width: 88.2px; }
      .brand .nav__wordmark { height: 78px; width: 150.1px; }
      h1 {
        margin: 0; font-family: var(--display); font-weight: 700;
        font-size: 54px; line-height: 1.06; letter-spacing: -0.02em; color: var(--text);
      }
      .url {
        margin: 34px 0 0; font-family: var(--mono); font-size: 21px; color: var(--text-dim);
      }
      .art { display: grid; place-items: center; }
      .art svg { width: 112%; height: auto; color: var(--text); }
      .rule { height: 3px; width: 96px; background: var(--accent); margin: 30px 0 0; }
    </style>
  </head>
  <body>
    <div>
      <div class="brand">
        <span class="nav__lambda"></span><span class="nav__wordmark"></span>
      </div>
      <h1>I build small things that make <span class="hl">big ideas visible</span>.</h1>
      <div class="rule"></div>
      <p class="url">emyotyyy.github.io</p>
    </div>
    <div class="art">
      <svg viewBox="0 0 232 128" fill="none" stroke="currentColor" stroke-width="4" aria-hidden="true"><line x1="24" y1="24" x2="200" y2="24" stroke-linecap="square"/><line x1="32" y1="88" x2="128" y2="88" stroke-linecap="square"/><line x1="24" y1="40" x2="104" y2="40" stroke-linecap="square"/><line x1="32" y1="72" x2="64" y2="72" stroke-linecap="square"/><line x1="64" y1="56" x2="96" y2="56" stroke-linecap="square"/><line x1="120" y1="40" x2="200" y2="40" stroke-linecap="square"/><line x1="128" y1="72" x2="160" y2="72" stroke-linecap="square"/><line x1="160" y1="56" x2="192" y2="56" stroke-linecap="square"/><line x1="32" y1="24" x2="32" y2="104" stroke-linecap="butt"/><line x1="64" y1="40" x2="64" y2="72" stroke-linecap="butt"/><line x1="96" y1="40" x2="96" y2="56" stroke-linecap="butt"/><line x1="128" y1="24" x2="128" y2="88" stroke-linecap="butt"/><line x1="160" y1="40" x2="160" y2="72" stroke-linecap="butt"/><line x1="192" y1="40" x2="192" y2="56" stroke-linecap="butt"/></svg>
    </div>
  </body>
</html>
